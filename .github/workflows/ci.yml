name: CI

on:
  push:
    branches: [main, master, "rc/**", "feature/**"]
  pull_request:

jobs:
  offline:
    name: Ruff + offline pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_Source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02_Source/pyproject.toml

      - name: Install package (core + desktop + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Offline pytest
        run: >
          python -m pytest
          -m "not real_model and not real_host"
          --ignore=tests/ui
          --tb=short

      - name: Optional coverage (non-blocking summary)
        continue-on-error: true
        run: |
          python -m pip install "pytest-cov>=5,<7"
          python -m pytest \
            -m "not real_model and not real_host" \
            --ignore=tests/ui \
            --cov=nova_layer.object_workflow \
            --cov-report=term-missing:skip-covered \
            --tb=line -q
